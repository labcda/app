<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F4C5C">
<title>Questionário - Laboratório CDA</title>
<style>
:root{--az:#0F4C5C;--tq:#37A7AA;--cl:#E5F4F3;--tx:#0b1f3a;--mut:#64748b;--bd:#cbd5e1}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f1f5f9;color:var(--tx);-webkit-text-size-adjust:100%}
.topo{background:linear-gradient(135deg,var(--az),var(--tq));padding:18px 16px 22px;text-align:center;color:#fff}
.topo img{background:#fff;border-radius:12px;padding:6px 12px;width:150px;height:auto}
.topo h1{font-size:1.15rem;margin:12px 0 2px}
.topo p{margin:0;font-size:.85rem;opacity:.9}
.wrap{max-width:640px;margin:-14px auto 40px;padding:0 14px}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(15,76,92,.10);margin-bottom:14px}
.id{display:flex;gap:10px;flex-wrap:wrap;font-size:.9rem}
.id div{background:var(--cl);border-radius:12px;padding:8px 12px;flex:1;min-width:140px}
.id small{display:block;color:var(--tq);font-weight:800;text-transform:uppercase;font-size:.65rem;letter-spacing:.06em}
.q{margin:20px 0 0}
.q b{display:block;font-size:1rem}
.q .d{display:block;color:var(--mut);font-size:.82rem;margin-top:2px}
.op{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.op label{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:8px;min-width:90px;border:2px solid var(--bd);border-radius:14px;padding:14px 12px;font-weight:700;font-size:1rem;cursor:pointer;background:#fff}
.op input{position:absolute;opacity:0;pointer-events:none}
.op label:has(input:checked){border-color:var(--az);background:var(--cl);color:var(--az)}
input[type=text],input[type=tel]{width:100%;border:2px solid var(--bd);border-radius:14px;padding:14px;font-size:1.05rem;margin-top:10px;background:#fff}
input[type=text]:focus{outline:none;border-color:var(--tq)}
.pos{display:flex;align-items:center;gap:10px}.pos span{font-size:.95rem;margin-top:10px}
.obs{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px;font-size:.88rem;line-height:1.45;margin-top:22px}
canvas{width:100%;height:200px;border:2px dashed var(--tq);border-radius:14px;background:#fff;touch-action:none;margin-top:8px;display:block}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:17px;font-size:1.05rem;font-weight:800;color:#fff;background:var(--az);margin-top:16px;cursor:pointer}
.btn.sec{background:#64748b;padding:11px;font-size:.9rem;margin-top:8px;width:auto;display:inline-block}
.btn:disabled{opacity:.6}
.msg{border-radius:14px;padding:14px;font-weight:700;text-align:center}
.erro{background:#fee2e2;color:#991b1b;margin-top:14px}
.ok{background:#dcfce7;color:#166534}
.cen{text-align:center;padding:30px 10px}
.cen .i{font-size:3rem}
.lgpd{font-size:.72rem;color:var(--mut);text-align:center;margin-top:14px}
.spin{width:34px;height:34px;border:4px solid var(--cl);border-top-color:var(--az);border-radius:50%;animation:g 1s linear infinite;margin:20px auto}
@keyframes g{to{transform:rotate(360deg)}}
</style>
</head>

<div class="wrap"><div id="app"><div class="card cen"><div class="spin"></div><p>Carregando… pode levar alguns segundos.</p></div></div></div>
<script>
// Endereço do servidor da Qualidade (não é segredo: sem o código do link nada funciona).
var API = 'https://script.google.com/macros/s/AKfycbxS3cBgs1SLOaFdJrgT--7oX23n8u-x92dUEEYxhBMiK6UUzAY-bnIXndjKRm-rqL0Zcg/exec';
var TOKEN = new URLSearchParams(location.search).get('t') || '';
var app = document.getElementById('app'), modelo = null, pad = null;
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function aviso(icone, titulo, texto){ app.innerHTML = '<div class="card cen"><div class="i">' + icone + '</div><h2>' + esc(titulo) + '</h2><p>' + esc(texto) + '</p></div>'; }

// Leitura com até 3 tentativas em paralelo (o servidor do Google às vezes demora): usa a primeira resposta válida.
function obter(){
  return new Promise(function(resolve, reject){
    var url = API + '?acao=publicoObter&t=' + encodeURIComponent(TOKEN), fim = false, pend = 0, ctrls = [];
    function tenta(){
      if (fim) return; pend++;
      var c = new AbortController(); ctrls.push(c);
      fetch(url, { signal: c.signal }).then(function(r){ return r.json(); }).then(function(j){
        if (fim) return; fim = true; ctrls.forEach(function(x){ if (x !== c) { try { x.abort(); } catch(e){} } }); resolve(j);
      }).catch(function(){ pend--; if (!fim && pend === 0 && ctrls.length >= 3) { fim = true; reject(new Error('sem conexão')); } });
    }
    tenta(); setTimeout(tenta, 600); setTimeout(tenta, 1400);
  });
}

function campo(q){
  var h = '<div class="q"><b>' + esc(q.label) + (q.obrig ? ' <span style="color:#dc2626">*</span>' : '') + '</b>' + (q.dica ? '<span class="d">' + esc(q.dica) + '</span>' : '');
  if (q.tipo === 'radio') h += '<div class="op">' + q.opcoes.map(function(o){ return '<label><input type="radio" name="q_' + q.id + '" value="' + esc(o) + '"> ' + esc(o) + '</label>'; }).join('') + '</div>';
  else h += '<div class="pos"><input type="text" id="q_' + q.id + '" autocomplete="off" ' + (q.tipo === 'numero' ? 'inputmode="numeric"' : '') + (q.pos ? '' : '') + '>' + (q.pos ? '<span>' + esc(q.pos) + '</span>' : '') + '</div>';
  return h + '</div>';
}

function montar(m){
  modelo = m; document.getElementById('titulo').textContent = m.titulo;
  var h = '<div class="card"><p style="margin:0 0 10px">Olá, <b>' + esc(m.cliente) + '</b>! Responda as perguntas abaixo e assine com o dedo. Leva 1 minuto.</p>' +
    '<div class="id"><div><small>Cliente</small>' + esc(m.cliente) + '</div><div><small>Nº do pedido</small>' + esc(m.pedido) + '</div></div></div><div class="card">';
  m.perguntas.filter(function(q){ return !q.anexoA; }).forEach(function(q){
    h += campo(q);
    m.perguntas.filter(function(a){ return a.anexoA === q.id; }).forEach(function(a){ h += '<div class="q"><span class="d">' + esc(a.label) + '</span><input type="text" id="q_' + a.id + '" autocomplete="off"></div>'; });
  });
  h += '<div class="obs">' + esc(m.observacao) + '</div>';
  m.finais.forEach(function(q){ h += campo(q); });
  h += '<div class="q"><b>Assinatura <span style="color:#dc2626">*</span></b><span class="d">Assine com o dedo no quadro abaixo.</span><canvas id="cv"></canvas><button class="btn sec" id="limpar" type="button">Limpar assinatura</button></div>' +
    '<div id="err"></div><button class="btn" id="enviar" type="button">Enviar questionário</button><p class="lgpd">Suas respostas são sigilosas e serão usadas pelo laboratório apenas para a realização do exame.</p></div>';
  app.innerHTML = h; pad = criaPad(document.getElementById('cv'));
  document.getElementById('limpar').onclick = function(){ pad.limpar(); };
  document.getElementById('enviar').onclick = enviar;
}

function criaPad(cv){
  var r = window.devicePixelRatio || 1, w = cv.clientWidth || (cv.parentElement && cv.parentElement.clientWidth) || 320, h = cv.clientHeight || 200; cv.width = Math.round(w * r); cv.height = Math.round(h * r);
  var ctx = cv.getContext('2d'); ctx.setTransform(r, 0, 0, r, 0, 0); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0b1f3a';
  var d = false, ult = null, tem = false;
  function pos(e){ var b = cv.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; }
  cv.onpointerdown = function(e){ e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch(x){} d = true; ult = pos(e); tem = true; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.arc(ult.x, ult.y, 1.2, 0, 7); ctx.fillStyle = '#0b1f3a'; ctx.fill(); ctx.beginPath(); ctx.moveTo(ult.x, ult.y); };
  cv.onpointermove = function(e){ if (!d) return; e.preventDefault(); var p = pos(e), mx = (ult.x + p.x) / 2, my = (ult.y + p.y) / 2; ctx.lineWidth = 2.6; ctx.quadraticCurveTo(ult.x, ult.y, mx, my); ctx.stroke(); ctx.beginPath(); ctx.moveTo(mx, my); ult = p; };
  cv.onpointerup = cv.onpointercancel = cv.onpointerleave = function(){ d = false; };
  return {
    limpar: function(){ ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.setTransform(r, 0, 0, r, 0, 0); tem = false; },
    tem: function(){ return tem; },
    exportar: function(){
      var W = cv.width, H = cv.height, dt = ctx.getImageData(0, 0, W, H).data, x0 = W, y0 = H, x1 = 0, y1 = 0;
      for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) if (dt[(y * W + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      if (x1 <= x0 || y1 <= y0) return '';
      var m = 8; x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(W - 1, x1 + m); y1 = Math.min(H - 1, y1 + m);
      var ww = x1 - x0 + 1, hh = y1 - y0 + 1, e = Math.min(1, 480 / ww), o = document.createElement('canvas'); o.width = Math.round(ww * e); o.height = Math.round(hh * e);
      o.getContext('2d').drawImage(cv, x0, y0, ww, hh, 0, 0, o.width, o.height); return o.toDataURL('image/png');
    }
  };
}

function enviar(){
  var err = document.getElementById('err'), btn = document.getElementById('enviar'); err.innerHTML = '';
  var resp = {}, falta = '';
  modelo.perguntas.concat(modelo.finais).forEach(function(q){
    if (q.tipo === 'radio'){ var r = document.querySelector('input[name="q_' + q.id + '"]:checked'); resp[q.id] = r ? r.value : ''; }
    else resp[q.id] = (document.getElementById('q_' + q.id).value || '').trim();
    if (q.obrig && !resp[q.id] && !falta) falta = q.label;
  });
  function erro(t){ err.innerHTML = '<div class="msg erro">' + esc(t) + '</div>'; err.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  if (falta) return erro('Responda: ' + falta);
  if (!pad.tem()) return erro('Assine no quadro antes de enviar.');
  var img = pad.exportar(); if (!img) return erro('Assinatura vazia.');
  btn.disabled = true; btn.textContent = 'Enviando… aguarde (não feche a página)';
  var c = new AbortController(), t = setTimeout(function(){ c.abort(); }, 70000);
  fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ acao: 'publicoEnviar', t: TOKEN, respostas: resp, assinatura_img: img }), signal: c.signal })
    .then(function(r){ return r.json(); }).then(function(j){
      clearTimeout(t);
      if (j.ok) { document.getElementById('titulo').textContent = 'Enviado'; aviso('✅', 'Tudo certo!', 'Seu questionário foi enviado ao laboratório. Obrigado!'); }
      else { btn.disabled = false; btn.textContent = 'Enviar questionário'; erro(j.erro || 'Não foi possível enviar.'); }
    }).catch(function(){
      // pode ter sido gravado mesmo sem resposta: confere o status do link
      obter().then(function(j){ if (j && j.status === 'preenchido') aviso('✅', 'Tudo certo!', 'Seu questionário foi enviado ao laboratório. Obrigado!'); else { btn.disabled = false; btn.textContent = 'Enviar questionário'; erro('A conexão falhou. Confira a internet e toque em Enviar de novo.'); } })
        .catch(function(){ btn.disabled = false; btn.textContent = 'Enviar questionário'; erro('Sem conexão. Toque em Enviar de novo.'); });
    });
}

if (!/^[a-f0-9]{32}$/.test(TOKEN)) aviso('🔗', 'Link incompleto', 'Peça ao laboratório para enviar o link novamente.');
else obter().then(function(j){
  if (j.status === 'pendente') montar(j.dados || j);
  else if (j.dados && j.dados.status === 'pendente') montar(j.dados);
  else if (j.ok === false) aviso('⚠️', 'Link inválido', 'Peça ao laboratório para enviar o link novamente.');
  else { var st = (j.dados || j).status; aviso('⌛', st === 'preenchido' ? 'Questionário já enviado' : 'Link expirado', st === 'preenchido' ? 'Este questionário já foi preenchido. Obrigado!' : 'Este link não vale mais. Peça ao laboratório para enviar outro.'); }
}).catch(function(){ aviso('📶', 'Sem conexão', 'Não foi possível carregar. Confira a internet e abra o link de novo.'); });
</script>
